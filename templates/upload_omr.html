<!DOCTYPE html>
<html>
<head>
  <title>Upload OMR - Innomatics</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 100px; }
    form { background: #f4f4f4; display: inline-block; padding: 20px; border-radius: 10px; }
  </style>
</head>
<body>
  <h2>📤 Upload Your OMR Sheet</h2>
  <form action="/upload_omr_file" method="POST" enctype="multipart/form-data">
    <input type="file" name="omr_file" accept="image/*" required><br><br>
    <button type="submit">Upload</button>
  </form>
</body>
</html>
