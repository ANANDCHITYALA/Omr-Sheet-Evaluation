<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innomatics | Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(120deg, #111827, #1e293b, #111827);
      color: white;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen">
  <!-- Header -->
  <header class="bg-white text-gray-900 shadow-md py-4 px-8 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-pink-700">Innomatics Admin Portal</h1>
    <div>
      <button
        id="logoutBtn"
        class="bg-red-500 hover:bg-red-400 text-white font-semibold px-4 py-2 rounded-lg transition">
        Logout
      </button>
    </div>
  </header>

  <!-- Dashboard Content -->
  <main class="flex-1 p-10">
    <h2 class="text-3xl font-semibold text-center mb-10 text-pink-400">Pending Approvals</h2>

    <div class="overflow-x-auto max-w-5xl mx-auto bg-white/10 rounded-xl shadow-xl p-6 backdrop-blur-md">
      <table class="w-full border-collapse text-center">
        <thead>
          <tr class="bg-pink-600/80 text-white">
            <th class="py-3 px-4 rounded-tl-xl">Name</th>
            <th class="py-3 px-4">Email</th>
            <th class="py-3 px-4">Role</th>
            <th class="py-3 px-4 rounded-tr-xl">Actions</th>
          </tr>
        </thead>
        <tbody id="userTable" class="text-gray-200"></tbody>
      </table>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white text-gray-800 py-3 text-center mt-auto">
    © 2025 Innomatics Research Labs. All rights reserved.
  </footer>

  <script>
    // Fetch all users when page loads
    async function fetchUsers() {
      const res = await fetch("/get_users", { credentials: "include" });
      const users = await res.json();
      const tbody = document.getElementById("userTable");
      tbody.innerHTML = "";

      users.forEach((user) => {
        if (!user.is_approved && user.role !== "admin") {
          const tr = document.createElement("tr");
          tr.classList.add("border-b", "border-gray-700");

          tr.innerHTML = `
            <td class="py-3 px-4">${user.name}</td>
            <td class="py-3 px-4">${user.email}</td>
            <td class="py-3 px-4 capitalize">${user.role}</td>
            <td class="py-3 px-4">
              <button onclick="approveUser('${user.email}')" class="bg-green-500 hover:bg-green-400 px-3 py-2 rounded-lg mx-1 text-white">Approve</button>
              <button onclick="rejectUser('${user.email}')" class="bg-red-500 hover:bg-red-400 px-3 py-2 rounded-lg mx-1 text-white">Reject</button>
            </td>
          `;
          tbody.appendChild(tr);
        }
      });
    }

    // Approve user
async function approveUser(email) {
  const res = await fetch("/approve_user", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "include", // ✅ important line
    body: JSON.stringify({ email })
  });
  const result = await res.json();
  alert(result.message || result.error);
  fetchUsers();
}

// Reject user
async function rejectUser(email) {
  const res = await fetch("/reject_user", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "include", // ✅ important line
    body: JSON.stringify({ email })
  });
  const result = await res.json();
  alert(result.message || result.error);
  fetchUsers();
}


    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch("/logout");
      window.location.href = "/";
    });

    fetchUsers();
  </script>
</body>
</html>
