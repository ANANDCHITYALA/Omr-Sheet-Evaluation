<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Set Password - Innomatics</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
  <form method="POST" class="bg-gray-800 p-8 rounded-2xl shadow-lg w-96 text-center">
    <h2 class="text-2xl font-bold mb-6 text-pink-400">🔐 Set Your Password</h2>
    <input type="password" name="password" placeholder="Enter new password"
           required class="w-full p-3 rounded-lg text-black mb-4" />
    <button type="submit"
            class="bg-pink-600 hover:bg-pink-500 text-white px-4 py-2 rounded-lg w-full">
      Save Password
    </button>
  </form>
</body>
</html>
