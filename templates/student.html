<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration - Innomatics Research Labs</title>
  <link rel="icon" href="https://www.innomatics.in/favicon.ico" type="image/x-icon" />
  <!-- <link rel="stylesheet" href="./style.css" /> -->
   <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="logo">
        <!-- <a href="./index.html"> -->
          <img src="https://www.innomatics.in/wp-content/uploads/2023/01/Innomatics-Logo1.png" alt="Innomatics Logo" />
        <!-- </a> -->
      </div>
      <div class="menu">
        
         <div><a href="{{ url_for('result') }}">Result</a></div>
         <div><a href="{{ url_for('home') }}">EXIT</a></div> 
         
      </div>
    </div>
  </header>

  <main class="student-main">
  <section class="student-wrapper">
    <div class="student-box">
      <div class="form-header">
        <h2 id="formTitle">📝 Student Registration</h2>
        <div class="tab-switch">
          <button id="registerTab" class="active">Register</button>
          <button id="loginTab">Login</button>
        </div>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" class="form active">
        <input type="text" placeholder="Full Name" required />
        <input type="text" placeholder="Roll Number" required />
        <input type="email" placeholder="Email ID" required />
        <input type="tel" placeholder="Contact Number" required />
        <input type="text" placeholder="Course (e.g. Data Science)" required />
        <input type="text" placeholder="Batch (e.g. June 2025)" required />
        <select required>
          <option value="">Select Exam Set</option>
          <option value="A">Set A</option>
          <option value="B">Set B</option>
          <option value="C">Set C</option>
          <option value="D">Set D</option>
        </select>
        <button type="submit" class="submit-btn">Register</button>
      </form>

      <!-- Login Form -->
      <form id="loginForm" class="form">
        <input id="loginEmail" type="email" placeholder="Registered Email" required />
        <input id="loginPassword" type="password" placeholder="Password" required />
        <button type="submit" class="submit-btn">Login</button>
      </form>
    </div>
  </section>
</main>



  <footer>
    <p>© 2025 Innomatics Research Labs | All Rights Reserved</p>
  </footer>

  <!-- JavaScript -->
  <script>
  const registerTab = document.getElementById("registerTab");
  const loginTab = document.getElementById("loginTab");
  const registerForm = document.getElementById("registerForm");
  const loginForm = document.getElementById("loginForm");
  const formTitle = document.getElementById("formTitle");

  // Tab toggle behavior
  registerTab.addEventListener("click", () => {
    formTitle.textContent = "📝 Student Registration";
    registerTab.classList.add("active");
    loginTab.classList.remove("active");
    registerForm.classList.add("active");
    loginForm.classList.remove("active");
  });

  loginTab.addEventListener("click", () => {
    formTitle.textContent = "🔐 Student Login";
    loginTab.classList.add("active");
    registerTab.classList.remove("active");
    loginForm.classList.add("active");
    registerForm.classList.remove("active");
  });

  // ✅ Student Registration — matches Flask route /register_student
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    name: document.querySelector('#registerForm input[placeholder="Full Name"]').value.trim(),
    roll: document.querySelector('#registerForm input[placeholder="Roll Number"]').value.trim(),
    email: document.querySelector('#registerForm input[placeholder="Email ID"]').value.trim(),
    contact: document.querySelector('#registerForm input[placeholder="Contact Number"]').value.trim(),
    course: document.querySelector('#registerForm input[placeholder="Course (e.g. Data Science)"]').value.trim(),
    batch: document.querySelector('#registerForm input[placeholder="Batch (e.g. June 2025)"]').value.trim(),
    exam_set: document.querySelector('#registerForm select').value,
    password: document.querySelector('#registerForm input[placeholder="Full Name"]').value.trim() + "@123" // simple default password
  };

  // basic validation
  if (!data.name || !data.roll || !data.email || !data.course || !data.batch || !data.exam_set) {
    alert("⚠️ Please fill in all fields.");
    return;
  }

  const res = await fetch("/register_student", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();
  alert(result.message || result.error);

  if (result.message) e.target.reset();
});


  // ✅ Student Login — matches Flask route /student_login
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();

    if (!email || !password) {
      alert("⚠️ Please fill in both fields.");
      return;
    }

    const res = await fetch("/student_login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email, password })
    });

    const result = await res.json();

    // if (res.ok && result.message) {
    //   alert("✅ " + result.message);
    //   window.location.href = "./upload_omr.html"; // redirect to upload OMR page
    // } else {
    //   alert("❌ " + (result.error || "Login failed."));
    // }
    if (result.error) {
    alert(result.error);
  } else {
    alert(result.message || "Login successful!");
    if (result.redirect) {
      window.location.href = result.redirect; // ✅ actual redirect here
    }
  }
  });






   
</script>

</body>
</html>
